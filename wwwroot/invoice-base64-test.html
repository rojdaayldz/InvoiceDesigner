<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Base64 Fatura Testi</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 40px;
        }

        .test-card {
            max-width: 600px;
            padding: 24px;
            border: 1px solid #dddddd;
            border-radius: 10px;
        }

        input,
        button {
            display: block;
            margin-top: 16px;
        }

        button {
            padding: 10px 18px;
            cursor: pointer;
        }

        #message {
            margin-top: 16px;
        }
    </style>
</head>

<body>
    <div class="test-card">
        <h2>Base64 Fatura Testi</h2>

        <p>
            Örnek fatura HTML dosyasını seçip Designer ekranında aç.
        </p>

        <input type="file"
               id="invoiceFile"
               accept=".html,.htm,text/html">

        <button type="button"
                id="openDesignerButton">
            Faturayı Designer'da Aç
        </button>

        <div id="message"></div>
    </div>

    <script>
        const fileInput =
            document.getElementById("invoiceFile");

        const openButton =
            document.getElementById("openDesignerButton");

        const message =
            document.getElementById("message");

        openButton.addEventListener("click", async function () {
            const file = fileInput.files[0];

            if (!file) {
                message.textContent =
                    "Önce bir HTML fatura dosyası seçmelisiniz.";

                return;
            }

            openButton.disabled = true;
            message.textContent = "Fatura hazırlanıyor...";

            try {
                const fileBytes =
                    await file.arrayBuffer();

                const base64 =
                    arrayBufferToBase64(fileBytes);

                const response = await fetch(
                    "/Designer/OpenInvoiceDesigner",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            base64: base64
                        })
                    }
                );

                const result = await response.json();

                if (!response.ok || !result.success) {
                    throw new Error(
                        result.message ||
                        "Fatura gönderilemedi."
                    );
                }

                window.location.href =
                    result.redirectUrl;
            } catch (error) {
                console.error(error);

                message.textContent =
                    error.message ||
                    "Fatura açılırken hata oluştu.";

                openButton.disabled = false;
            }
        });

        function arrayBufferToBase64(buffer) {
            const bytes = new Uint8Array(buffer);
            const chunkSize = 32768;

            let binaryText = "";

            for (
                let index = 0;
                index < bytes.length;
                index += chunkSize
            ) {
                const chunk =
                    bytes.subarray(
                        index,
                        index + chunkSize
                    );

                binaryText +=
                    String.fromCharCode(...chunk);
            }

            return btoa(binaryText);
        }
    </script>
</body>
</html>
